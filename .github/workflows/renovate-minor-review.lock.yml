name: "Renovate Minor Upgrade Analysis"
on:
  # roles: all # Roles processed as role check in pre-activation job
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      head_sha:
        description: Optional head guard for manually dispatched analysis
        required: false
        type: string
      pr_number:
        description: Renovate pull request number
        required: true
        type: string
      version_key:
        description: SHA256 of the sorted minor dependency version tuples
        required: true
        type: string

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  cancel-in-progress: false
  group: renovate-minor-${{ inputs.pr_number }}

run-name: "Renovate minor #${{ inputs.pr_number }} ${{ inputs.version_key }}"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_SERVICE_NAME: gh-aw.renovate-minor-review
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Renovate%20Minor%20Upgrade%20Analysis,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_LOGS_ENABLED: ${{ vars.GH_AW_OTLP_LOGS_ENABLED }}
  GH_AW_OTLP_LOGS_MAX_BYTES: ${{ vars.GH_AW_OTLP_LOGS_MAX_BYTES }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
