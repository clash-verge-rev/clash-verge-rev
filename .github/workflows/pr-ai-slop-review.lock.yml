name: "PR AI Slop Review"
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  # roles: all # Roles processed as role check in pre-activation job
  # skip-bots: # Skip-bots processed as bot check in pre-activation job
  # - dependabot # Skip-bots processed as bot check in pre-activation job
  # - renovate # Skip-bots processed as bot check in pre-activation job
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string

permissions: {}

concurrency:
  group: "gh-aw-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}"
  cancel-in-progress: true

run-name: "PR AI Slop Review"

