const SUPPORTED=Object.keys(I18N);
function normalizeLang(v){v=String(v||'').toLowerCase().replace(/_/g,'-');if(!v)return '';if(v==='zh'||v==='zh-cn'||v==='zh-hans'||v==='zh-sg')return 'zh';if(v.startsWith('zh'))return 'zhtw';if(v==='ja'||v.startsWith('ja-'))return 'jp';if(SUPPORTED.includes(v))return v;const base=v.split('-')[0];if(base==='ja')return 'jp';return SUPPORTED.includes(base)?base:''}
let LANG=normalizeLang(new URLSearchParams(location.search).get('lang'));
if(!LANG){for(const l of (navigator.languages||[]).concat([navigator.language])){LANG=normalizeLang(l);if(LANG)break}}
if(!LANG)LANG='zh';
function t(key,params){let s=(I18N[LANG]&&I18N[LANG][key])??I18N.zh[key]??key;if(params)for(const[k,v]of Object.entries(params))s=s.split('{'+k+'}').join(v);return s}
function applyI18n(){const htmlLang={zh:'zh-CN',zhtw:'zh-TW',jp:'ja'}[LANG]||LANG;document.documentElement.lang=htmlLang;document.documentElement.dir=(LANG==='ar'||LANG==='fa')?'rtl':'ltr';document.title=t('title');for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=t(el.dataset.i18n);for(const el of document.querySelectorAll('[data-i18n-ph]'))el.placeholder=t(el.dataset.i18nPh);for(const el of document.querySelectorAll('[data-i18n-aria]'))el.setAttribute('aria-label',t(el.dataset.i18nAria));for(const el of document.querySelectorAll('[data-i18n-title]'))el.title=t(el.dataset.i18nTitle)}
applyI18n();
const SERVER_ERRORS={'请输入域名、*.域名或 HTTP/HTTPS 地址前缀':'errInvalidRule','删除失败':'errDeleteFailed'};
const authToken=new URLSearchParams(location.search).get('token')||'';document.querySelector('a[href="/certificate"]').href='/certificate?token='+encodeURIComponent(authToken);
const $=id=>document.getElementById(id);let selected=null;let searchTimer;let refreshVersion=0;let currentPage=1;let totalPages=1;
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',...(authToken?{Authorization:'Bearer '+authToken}:{})},body:body===undefined?undefined:JSON.stringify(body)});if(r.status===401){throw Error(t('reopen'))}if(!r.ok){const text=(await r.text()).trim();throw Error(SERVER_ERRORS[text]?t(SERVER_ERRORS[text]):text)}return r.json()}

function decodeBody(value){const v={...value};if(v.encoding==='base64'){try{v.body=new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(v.body),c=>c.charCodeAt(0)));v.encoding='utf-8'}catch(e){}}return v}
function report(e){$('error').textContent=e.message}
function updateSummary(s){let state,rules='';if(!s.enabled)state=t('stateOff');else if(s.capture_all)state=t('stateAll');else if(s.rules.length){state=t('stateRules');rules=s.rules.map(r=>r.url).join(' · ')}else state=t('stateNone');$('filterState').textContent=state;const el=$('filterRules');el.textContent=rules;el.hidden=!rules}
$('toggleEditor').onclick=()=>{const open=$('ruleEditor').hidden;$('ruleEditor').hidden=!open;$('toggleEditor').textContent=open?t('collapse'):t('edit');$('toggleEditor').setAttribute('aria-expanded',String(open));$('filterBar').classList.toggle('expanded',open)};
async function settings(){const s=await api('settings');$('enabled').checked=s.enabled;$('capture_all').checked=s.capture_all;updateSummary(s);$('rules').replaceChildren();for(const rule of s.rules){const li=document.createElement('li');const text=document.createElement('span');text.textContent=rule.url;li.append(text);const b=document.createElement('button');b.textContent=t('remove');b.setAttribute('aria-label',t('remove')+' '+rule.url);b.onclick=()=>api('rules/'+rule.id,'DELETE').then(settings).catch(report);li.append(b);$('rules').append(li)}}
$('enabled').onchange=$('capture_all').onchange=async()=>{try{await api('settings','PUT',{enabled:$('enabled').checked,capture_all:$('capture_all').checked})}catch(e){report(e)}await settings()};
$('ruleForm').onsubmit=async e=>{e.preventDefault();try{await api('rules','POST',{url:$('url').value});$('url').value='';await settings()}catch(e){report(e)}};
async function show(id){selected=id;const f=await api('flows/'+id);if(selected!==id)return;if(!$('detail').open)$('detail').showModal();$('selected').textContent=f.method+' '+f.url;for(const k of ['request','response'])$(''+k).textContent=f[k]?JSON.stringify(decodeBody(f[k]),null,2):(f.error||t('waiting'))}

function shellQuote(value){return "'"+String(value).replace(/'/g,"'\\''")+"'"}
function toCurl(f){const r=f.request;if(!r)throw Error(t('curlNotRecorded'));if(r.truncated)throw Error(t('curlTruncated'));const args=['curl','--request',shellQuote(f.method),'--url',shellQuote(f.url)];for(const [name,value] of r.headers||[]){if(!['content-length','transfer-encoding','connection','proxy-connection','accept-encoding'].includes(name.toLowerCase()))args.push('--header',shellQuote(name+': '+value))}if(r.body){args.push('--data-binary','@-');return "printf '%s' "+shellQuote(r.body)+' | base64 --decode | '+args.join(' ')}return args.join(' ')}
function showCopyDialog(command){const dialog=$('copyDialog');$('copyText').value=command;if(!dialog.open)dialog.showModal();$('copyText').focus();$('copyText').select()}
$('selectAll').onclick=()=>{$('copyText').focus();$('copyText').select()};
async function copyCurl(id){let command;try{command=toCurl(await api('flows/'+id))}catch(e){report(e);return}try{await navigator.clipboard.writeText(command);$('clearMessage').textContent=t('copied');return}catch(e){}try{const input=document.createElement('textarea');input.value=command;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();const copied=document.execCommand('copy');input.remove();if(copied){$('clearMessage').textContent=t('copied');return}}catch(e){}showCopyDialog(command)}

async function refresh(){const version=++refreshVersion;try{const data=await api('flows?page='+currentPage+'&q='+encodeURIComponent($('search').value)+'&domain='+encodeURIComponent($('domain').value));if(version!==refreshVersion)return;const rows=data.items;currentPage=data.page;totalPages=data.pages;$('pageInfo').textContent=t('pageInfo',{page:currentPage,pages:totalPages});$('prevPage').disabled=currentPage<=1;$('nextPage').disabled=currentPage>=totalPages;$('resultCount').textContent=data.total?t('resultCount',{total:data.total,count:rows.length}):t('noResults');$('flows').replaceChildren();for(const f of rows){const tr=document.createElement('tr');for(const [i,v] of [f.method,f.url,f.error?t('failed'):f.status||t('pending')].entries()){const td=document.createElement('td');if(i===1){const button=document.createElement('button');button.className='request-open';button.textContent=v;button.onclick=()=>show(f.id).catch(report);td.append(button)}else{const badge=document.createElement('span');badge.className=i===0?'method':'status'+(f.error||f.status>=400?' failed':!f.status?' pending':'');badge.textContent=v;td.append(badge)}tr.append(td)}const action=document.createElement('td');action.className='row-actions';const copy=document.createElement('button');copy.className='copy-curl';copy.title=t('copyCurl');copy.setAttribute('aria-label',t('copyCurl'));copy.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>';copy.onclick=()=>copyCurl(f.id);action.append(copy);tr.append(action);$('flows').append(tr)}await loadDomains();if(selected)await show(selected)}catch(e){report(e)}}
async function loadDomains(){const rows=await api('flow-domains');const value=$('domain').value;const first=document.createElement('option');first.value='';first.textContent=t('allDomains');const options=[first];for(const row of rows){const option=document.createElement('option');option.value=row.domain;option.textContent=row.domain+' ('+row.count+')';options.push(option)}if(value&&!rows.some(r=>r.domain===value)){const option=document.createElement('option');option.value=value;option.textContent=value+' (0)';options.push(option)}$('domain').replaceChildren(...options);$('domain').value=value;$('clearDomain').disabled=!value}
function confirmClear(message){const dialog=$('clearConfirm');if(dialog.open)return Promise.resolve(false);$('clearConfirmMessage').textContent=message;dialog.returnValue='';return new Promise(resolve=>{dialog.onclose=()=>resolve(dialog.returnValue==='clear');dialog.showModal()})}
async function clearRecords(all){const domain=all?'':$('domain').value;if(!all&&!domain)return;const suffix=domain?'?domain='+encodeURIComponent(domain):'';try{const info=await api('flow-count'+suffix);if(!info.count){$('clearMessage').textContent=t('nothingToClear');return}const scope=all?t('scopeAll'):t('scopeDomain',{domain});if(!await confirmClear(t('clearConfirmBody',{scope,count:info.count})))return;$('clearAll').disabled=true;$('clearDomain').disabled=true;++refreshVersion;selected=null;$('detail').close();const result=await api('flows'+suffix,'DELETE');currentPage=1;$('clearMessage').textContent=t('cleared',{count:result.deleted});await refresh()}catch(e){report(e)}finally{$('clearAll').disabled=false;$('clearDomain').disabled=!$('domain').value}}
$('clearAll').onclick=()=>clearRecords(true);$('clearDomain').onclick=()=>clearRecords(false);$('domain').onchange=()=>{currentPage=1;++refreshVersion;$('clearDomain').disabled=!$('domain').value;refresh()};
$('closeDetail').onclick=()=>$('detail').close();$('detail').onclose=()=>{selected=null};
$('search').oninput=()=>{currentPage=1;++refreshVersion;clearTimeout(searchTimer);searchTimer=setTimeout(refresh,250)};
$('prevPage').onclick=()=>{if(currentPage>1){currentPage--;++refreshVersion;refresh()}};$('nextPage').onclick=()=>{if(currentPage<totalPages){currentPage++;++refreshVersion;refresh()}};
settings().catch(report);refresh();setInterval(refresh,2000);
</script></html>
