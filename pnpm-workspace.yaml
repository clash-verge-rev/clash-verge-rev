enablePrePostScripts: false
allowBuilds:
  "@parcel/watcher": true
  core-js: true
  edgedriver: false
  es5-ext: true
  esbuild: true
  geckodriver: false
  meta-json-schema: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - dayjs@1.11.21

overrides:
  # 2.0.1 uses a regex lookbehind, which WebKit before Safari 16.4 cannot parse (#8079).
  mdast-util-gfm-autolink-literal: 2.0.0
