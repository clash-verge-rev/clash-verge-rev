_version: 1
notifications:
  dashboardToggled:
    title: داشبورد
    body: وضعیت نمایش داشبورد به‌روزرسانی شد.
  clashModeChanged:
    title: تغییر حالت
    body: به {mode} تغییر کرد.
  systemProxyToggled:
    title: پروکسی سیستم
    'on': System proxy has been enabled.
    'off': System proxy has been disabled.
  tunModeToggled:
    title: حالت TUN
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
  lightweightModeEntered:
    title: حالت سبک
    body: به حالت سبک وارد شد.
  profilesReactivated:
    title: پروفایل‌ها
    body: پروفایل دوباره فعال شد.
  appQuit:
    title: در آستانه خروج
    body: Clash Verge در آستانه خروج است.
  appHidden:
    title: برنامه پنهان شد
    body: Clash Verge در پس‌زمینه در حال اجراست.
  updateReady:
    title: Clash Verge Update
    body: A new version (v{version}) has been downloaded and is ready to install.
    installNow: Install Now
    later: Later
service:
  adminInstallPrompt: نصب سرویس Clash Verge به دسترسی مدیر نیاز دارد.
  adminUninstallPrompt: حذف سرویس Clash Verge به دسترسی مدیر نیاز دارد.
launchGuard:
  currentExeError: 'مکان برنامه مشخص نشد: {error}'
  homeDirError: 'پوشهٔ خانگی کاربر فعلی مشخص نشد. برنامه بسته خواهد شد: {error}'
  translocated: macOS این برنامه را از یک مسیر موقت App Translocation اجرا می‌کند. آن را در Finder به‌صورت دستی به /Applications یا ~/Applications منتقل کنید و دوباره باز کنید.
  rejected: |-
    این برنامه باید از پوشهٔ Applications اجرا شود.

    {reason}
  notInBundle: فایل اجرایی داخل بستهٔ برنامه نیست.
  canonicalizeBundleError: 'مسیر بستهٔ برنامه قابل تشخیص نیست: {error}'
  bundleNameError: نام بستهٔ برنامه مشخص نشد. برنامه بسته خواهد شد.
  replacePrompt: در {destination} از قبل برنامه‌ای وجود دارد. جایگزین و از Applications دوباره اجرا شود؟
  movePrompt: برای اجرای امن سرویس پس‌زمینه، برنامه باید به {destination} منتقل شود. اکنون منتقل و دوباره اجرا شود؟
  createApplicationsDirError: 'پوشهٔ Applications ایجاد نشد: {error}'
  moveFailed: انتقال برنامه ناموفق بود. آن را در Finder به‌صورت دستی منتقل کنید و دوباره تلاش کنید.
  replaceFailed: 'برنامهٔ موجود به‌صورت امن جایگزین نشد: {error}'
  relaunchFailed: برنامه کپی شد، اما اجرای دوبارهٔ خودکار ناموفق بود. آن را به‌صورت دستی از Applications باز کنید.
