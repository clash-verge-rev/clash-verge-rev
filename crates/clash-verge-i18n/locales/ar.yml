  createApplicationsDirError: 'تعذر إنشاء مجلد Applications: {error}'
  moveFailed: فشل نقل التطبيق. انقله يدويًا في Finder ثم أعد المحاولة.
  replaceFailed: 'تعذر استبدال التطبيق الموجود بأمان: {error}'
