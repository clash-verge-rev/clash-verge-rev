_version: 1
notifications:
  dashboardToggled:
    title: İdarə paneli
    body: İdarə panelinin görünmə vəziyyəti dəyişdi.
  clashModeChanged:
    title: Rejim dəyişikliyi
    body: '{mode} rejiminə keçildi.'
  systemProxyToggled:
    title: Sistem proksisi
    'on': Sistem proksisi aktivləşdirildi.
    'off': Sistem proksisi söndürüldü.
  systemProxyFailed:
    title: Sistem proksisi
    body: Sistem proksisi qurulmadı, səbəbini öyrənmək üçün Clash Verge tətbiqini açın.
  systemProxyGuardStopped:
    title: Sistem proksisinin mühafizəsi
    body: Mühafizə bir neçə uğursuz cəhddən sonra dayandı, səbəbini öyrənmək üçün Clash Verge tətbiqini açın.
  tunModeToggled:
    title: TUN rejimi
    'on': TUN rejimi aktivləşdirildi.
    'off': TUN rejimi söndürüldü.
  lightweightModeEntered:
    title: Yüngül rejim
    body: Yüngül rejimə keçildi.
  profilesReactivated:
    title: Profillər
    body: Profil yenidən aktivləşdirildi.
  appQuit:
    title: Çıxış
    body: Clash Verge bağlanmaq üzrədir.
  appHidden:
    title: Tətbiqin gizlədilməsi
    body: Clash Verge arxa planda işləyir.
  updateReady:
    title: Clash Verge yeniləməsi
    body: Yeni versiya (v{version}) endirildi və quraşdırılmağa hazırdır.
    installNow: İndi quraşdır
    later: Sonra
