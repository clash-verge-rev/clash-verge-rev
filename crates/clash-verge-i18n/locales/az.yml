  adminInstallPrompt: Clash Verge xidmətini quraşdırmaq üçün administrator səlahiyyətləri tələb olunur.
  adminUninstallPrompt: Clash Verge xidmətini silmək üçün administrator səlahiyyətləri tələb olunur.
